# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.


# Site Settings
locale                   : "en-US"
title                    : Jamison L. Taylor Jr Portfolio
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : Jamison L. Taylor Jr
description              : Jamison L. Taylor Jr - Projects and CV 
baseurl                  : "/Cornell-University-Portfolio-Taylor-Jr/" # Set this to your repo name 

# Theme and Style
theme: jekyll-theme-minimal
color_scheme: aqua # light/default, dark, or aqua

sass:
  style: compressed

# Outputting
permalink: /:categories/:title/

collections:
  pages:
    output: false
  projects:
    output: false
    permalink: /:collection/:path/

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Plugins (previously gems:)
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

